name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx turbo run typecheck --filter=@expense/api
            - name: Setup test environment
        run: |
          cat > apps/api/.dev.vars <<'EOF'
          JWT_SECRET=ci-test-jwt-secret
          PASSWORD_PEPPER=ci-test-password-pepper
          ENVIRONMENT=test
          APP_VERSION=1.0.0
          GOOGLE_CLIENT_SECRET=
          EOF
      - name: Test
        run: bunx turbo run test --filter=@expense/api

      - name: Build
        run: bunx turbo run build --filter=@expense/api
