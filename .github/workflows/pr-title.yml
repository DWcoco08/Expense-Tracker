name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
            style
            chore
          scopes: |
            api
            auth
            users
            wallets
            categories
            transactions
            stats
            budgets
            recurring
            notifications
            web
            db
            shared
            config
            ci
          requireScope: true
